global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: artio

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: artio-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [rest-api:8080]
    scrape_interval: 15s

  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]
