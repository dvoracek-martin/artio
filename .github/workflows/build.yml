name: Build, test and containerize

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            artio-storefront/package-lock.json
            artio-backoffice/package-lock.json
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test Docker plugin source packages
        run: |
          for plugin in stripe-payments paypal-payments brevo-email observability swiss-post; do
            python -m unittest discover -s "artio-plugins/$plugin" -p 'test_*.py' -v
          done
      - name: Require Docker for PostgreSQL integration tests
        run: docker info
      - name: Audit frontend dependencies
        run: |
          npm --registry=https://registry.npmjs.org audit --audit-level=moderate --prefix artio-storefront
          npm --registry=https://registry.npmjs.org audit --audit-level=moderate --prefix artio-backoffice
      - name: Build, run tests and generate coverage
        run: bash ./gradlew --no-daemon clean build integrationTest jacocoTestReport
      - name: Verify Docker extension lifecycle and egress isolation
        shell: pwsh
        run: ./scripts/verify-extension-runtime.ps1
      - name: Verify Docker observability plugin lifecycle
        shell: pwsh
        run: ./scripts/verify-observability-plugin.ps1
      - name: Verify payment provider plugin containers
        shell: pwsh
        run: ./scripts/verify-payment-provider-containers.ps1
      - name: Build API container
        run: docker build -f artio-docker/Dockerfile -t artio/api:${GITHUB_SHA} .
      - name: Build storefront container
        run: docker build -f artio-docker/Dockerfile.frontend --build-arg MODULE=artio-storefront --build-arg APP_NAME=storefront -t artio/storefront:${GITHUB_SHA} .
      - name: Build backoffice container
        run: docker build -f artio-docker/Dockerfile.frontend --build-arg MODULE=artio-backoffice --build-arg APP_NAME=backoffice -t artio/backoffice:${GITHUB_SHA} .
      - name: Build Stripe plugin container
        run: docker build -f artio-plugins/stripe-payments/Dockerfile -t artio/plugin-stripe:${GITHUB_SHA} artio-plugins/stripe-payments
      - name: Build PayPal plugin container
        run: docker build -f artio-plugins/paypal-payments/Dockerfile -t artio/plugin-paypal:${GITHUB_SHA} artio-plugins/paypal-payments
      - name: Build Swiss Post plugin container
        run: docker build -f artio-plugins/swiss-post/Dockerfile -t artio/plugin-swiss-post:${GITHUB_SHA} artio-plugins/swiss-post
      - name: Build Brevo plugin container
        run: docker build -f artio-plugins/brevo-email/Dockerfile -t artio/plugin-brevo:${GITHUB_SHA} artio-plugins/brevo-email
      - name: Build OpenSearch plugin container
        run: docker build -f artio-plugins/opensearch-search/Dockerfile -t artio/plugin-opensearch:${GITHUB_SHA} artio-plugins/opensearch-search
      - name: Build bundled OpenSearch engine container
        run: docker build -f artio-plugins/opensearch-search/opensearch/Dockerfile -t artio/plugin-opensearch-engine:${GITHUB_SHA} artio-plugins/opensearch-search/opensearch
      - name: Build observability control container
        run: docker build -f artio-plugins/observability/control/Dockerfile -t artio/plugin-observability-control:${GITHUB_SHA} artio-plugins/observability/control
      - name: Build observability collector container
        run: docker build -f artio-plugins/observability/collector/Dockerfile -t artio/plugin-observability-collector:${GITHUB_SHA} artio-plugins/observability/collector
      - name: Build observability Grafana container
        run: docker build -f artio-plugins/observability/grafana/Dockerfile -t artio/plugin-observability-grafana:${GITHUB_SHA} artio-plugins/observability/grafana
      - name: Build observability Jaeger container
        run: docker build -f artio-plugins/observability/jaeger/Dockerfile -t artio/plugin-observability-jaeger:${GITHUB_SHA} artio-plugins/observability/jaeger
      - name: Build observability Prometheus container
        run: docker build -f artio-plugins/observability/prometheus/Dockerfile -t artio/plugin-observability-prometheus:${GITHUB_SHA} artio-plugins/observability/prometheus
      - name: Scan API image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: artio/api:${{ github.sha }}
          version: v0.76.0
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
      - name: Scan Storefront image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: artio/storefront:${{ github.sha }}
          version: v0.76.0
          skip-setup-trivy: true
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
      - name: Scan Backoffice image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: artio/backoffice:${{ github.sha }}
          version: v0.76.0
          skip-setup-trivy: true
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
      - name: Scan Stripe plugin image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: artio/plugin-stripe:${{ github.sha }}
          version: v0.76.0
          skip-setup-trivy: true
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
      - name: Scan PayPal plugin image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: artio/plugin-paypal:${{ github.sha }}
          version: v0.76.0
          skip-setup-trivy: true
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
      - name: Scan Swiss Post plugin image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: artio/plugin-swiss-post:${{ github.sha }}
          version: v0.76.0
          skip-setup-trivy: true
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
      - name: Scan Brevo plugin image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: artio/plugin-brevo:${{ github.sha }}
          version: v0.76.0
          skip-setup-trivy: true
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
      - name: Scan OpenSearch plugin image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: artio/plugin-opensearch:${{ github.sha }}
          version: v0.76.0
          skip-setup-trivy: true
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
      - name: Scan bundled OpenSearch engine image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: artio/plugin-opensearch-engine:${{ github.sha }}
          version: v0.76.0
          skip-setup-trivy: true
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
      - name: Scan observability control image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: artio/plugin-observability-control:${{ github.sha }}
          version: v0.76.0
          skip-setup-trivy: true
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
      - name: Scan observability collector image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: artio/plugin-observability-collector:${{ github.sha }}
          version: v0.76.0
          skip-setup-trivy: true
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
      - name: Scan observability Grafana image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: artio/plugin-observability-grafana:${{ github.sha }}
          version: v0.76.0
          skip-setup-trivy: true
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
      - name: Scan observability Jaeger image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: artio/plugin-observability-jaeger:${{ github.sha }}
          version: v0.76.0
          skip-setup-trivy: true
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
      - name: Scan observability Prometheus image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: artio/plugin-observability-prometheus:${{ github.sha }}
          version: v0.76.0
          skip-setup-trivy: true
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
      - name: Package verified runtime artifacts
        if: github.event_name == 'push'
        run: |
          mkdir -p build/provenance
          tar -czf "build/provenance/artio-${GITHUB_SHA}.tar.gz" \
            artio-rest-api/build/libs \
            artio-backoffice/dist/backoffice \
            artio-storefront/dist/storefront
      - name: Upload verified runtime artifacts
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: artio-runtime-${{ github.sha }}
          path: build/provenance/*.tar.gz
          if-no-files-found: error
          retention-days: 30
      - name: Remove images created by this CI run
        if: always()
        run: |
          for image in \
            "artio/api:${GITHUB_SHA}" \
            "artio/storefront:${GITHUB_SHA}" \
            "artio/backoffice:${GITHUB_SHA}" \
            "artio/plugin-stripe:${GITHUB_SHA}" \
            "artio/plugin-paypal:${GITHUB_SHA}" \
            "artio/plugin-swiss-post:${GITHUB_SHA}" \
            "artio/plugin-brevo:${GITHUB_SHA}" \
            "artio/plugin-opensearch:${GITHUB_SHA}" \
            "artio/plugin-opensearch-engine:${GITHUB_SHA}" \
            "artio/plugin-observability-control:${GITHUB_SHA}" \
            "artio/plugin-observability-collector:${GITHUB_SHA}" \
            "artio/plugin-observability-grafana:${GITHUB_SHA}" \
            "artio/plugin-observability-jaeger:${GITHUB_SHA}" \
            "artio/plugin-observability-prometheus:${GITHUB_SHA}"; do
            docker image rm "$image" >/dev/null 2>&1 || true
          done

  attest:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download verified runtime artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: artio-runtime-${{ github.sha }}
          path: build/provenance
      - name: Attest runtime artifact provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: build/provenance/*.tar.gz
