spring:
  datasource:
    url: ${ARTIO_DATABASE_URL:jdbc:postgresql://localhost:5432/artio}
    username: ${ARTIO_DATABASE_USERNAME:artio}
    password: ${ARTIO_DATABASE_PASSWORD}
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    consumer:
      group-id: ${ARTIO_KAFKA_CONSUMER_GROUP:artio-notification-worker}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
    listener:
      ack-mode: record
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        max.block.ms: ${ARTIO_KAFKA_MAX_BLOCK_MS:3000}
  mail:
    host: ${ARTIO_SMTP_HOST:localhost}
    port: ${ARTIO_SMTP_PORT:1025}
    username: ${ARTIO_SMTP_USERNAME:}
    password: ${ARTIO_SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${ARTIO_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${ARTIO_SMTP_STARTTLS:false}
server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
management:
  health:
    mail:
      enabled: ${ARTIO_EMAIL_ENABLED:false}
    redis:
      enabled: ${ARTIO_CACHE_REDIS_ENABLED:false}
  tracing:
    enabled: ${MANAGEMENT_TRACING_ENABLED:false}
    sampling:
      probability: ${ARTIO_TRACING_SAMPLE_PROBABILITY:0.1}
  otlp:
    tracing:
      endpoint: ${ARTIO_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
    metrics:
      export:
        enabled: ${ARTIO_METRICS_OTLP_ENABLED:false}
        url: ${ARTIO_OTLP_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
artio:
  runtime:
    role: ${ARTIO_RUNTIME_ROLE:api}
  workers:
    enabled: ${ARTIO_WORKERS_ENABLED:true}
  setup:
    token: ${ARTIO_SETUP_TOKEN:}
  cache:
    redis:
      enabled: ${ARTIO_CACHE_REDIS_ENABLED:false}
  events:
    kafka:
      enabled: ${ARTIO_KAFKA_EVENTS_ENABLED:true}
      consumer-enabled: ${ARTIO_KAFKA_CONSUMER_ENABLED:false}
      order-topic: ${ARTIO_KAFKA_ORDER_TOPIC:artio.order.events}
      notification-consumer-group: ${ARTIO_KAFKA_CONSUMER_GROUP:artio-notification-worker}
      consumer-concurrency: ${ARTIO_KAFKA_CONSUMER_CONCURRENCY:1}
  mail-from: ${ARTIO_MAIL_FROM:no-reply@artio.local}
  notifications:
    email:
      enabled: ${ARTIO_EMAIL_ENABLED:false}
      provider: ${ARTIO_EMAIL_PROVIDER:smtp}
      extension-plugin-id: ${ARTIO_NOTIFICATIONS_EXTENSION_PLUGIN_ID:}
      poll-interval-ms: ${ARTIO_EMAIL_POLL_INTERVAL_MS:30000}
  security:
    jwt-secret: ${ARTIO_JWT_SECRET}
    encryption-key: ${ARTIO_ENCRYPTION_KEY}
    encryption-keyring: ${ARTIO_ENCRYPTION_KEYRING:${ARTIO_ENCRYPTION_KEYRING_FILE:}}
    extension-auth-key: ${ARTIO_EXTENSION_AUTH_KEY:${artio.security.encryption-key}}
    allowed-origins: ${ARTIO_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4201}
    oauth2-enabled: ${ARTIO_OAUTH2_ENABLED:false}
  search:
    enabled: ${ARTIO_SEARCH_ENABLED:false}
    provider: ${ARTIO_SEARCH_PROVIDER:opensearch}
    extension-plugin-id: ${ARTIO_SEARCH_EXTENSION_PLUGIN_ID:}
    url: ${ARTIO_SEARCH_URL:http://localhost:9200}
  rate-limit:
    enabled: ${ARTIO_RATE_LIMIT_ENABLED:true}
    requests-per-minute: ${ARTIO_RATE_LIMIT_PER_MINUTE:100}
  payments:
    stripe-secret-key: ${ARTIO_STRIPE_SECRET_KEY:}
    stripe-webhook-secret: ${ARTIO_STRIPE_WEBHOOK_SECRET:}
  storefront-url: ${ARTIO_STOREFRONT_URL:http://localhost:4200}
  checkout:
    shipping-cost: ${ARTIO_CHECKOUT_SHIPPING_COST:0.00}
  extensions:
    core-version: ${ARTIO_CORE_VERSION:0.1.0}
    trusted-registries: ${ARTIO_EXTENSION_TRUSTED_REGISTRIES:}
    controller:
      url: ${ARTIO_EXTENSION_CONTROLLER_URL:http://extension-controller:8090}
      token: ${ARTIO_EXTENSION_CONTROLLER_TOKEN:}
    docker:
      enabled: ${ARTIO_EXTENSION_DOCKER_ENABLED:false}
      mode: ${ARTIO_EXTENSION_DOCKER_MODE:remote}
      network: ${ARTIO_EXTENSION_DOCKER_NETWORK:artio-extensions}
      port: ${ARTIO_EXTENSION_DOCKER_PORT:8080}
  inventory:
    reservation-ttl: ${ARTIO_INVENTORY_RESERVATION_TTL:PT30M}
    expiry-interval-ms: ${ARTIO_INVENTORY_EXPIRY_INTERVAL_MS:60000}
