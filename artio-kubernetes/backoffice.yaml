apiVersion: apps/v1
kind: Deployment
metadata: { name: artio-backoffice }
spec:
  replicas: 2
  selector: { matchLabels: { app: artio-backoffice } }
  template:
    metadata: { labels: { app: artio-backoffice } }
    spec:
      containers:
        - name: web
          image: artio/backoffice:latest
          ports: [{ name: http, containerPort: 80 }]
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { cpu: 500m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata: { name: artio-backoffice }
spec:
  selector: { app: artio-backoffice }
  ports: [{ name: http, port: 80, targetPort: http }]
