apiVersion: apps/v1
kind: Deployment
metadata:
  name: artio-api
  labels: { app: artio-api }
spec:
  replicas: 3
  selector:
    matchLabels: { app: artio-api }
  template:
    metadata:
      labels: { app: artio-api }
    spec:
      containers:
        - name: api
          image: artio/api:latest
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: artio-config }
            - secretRef: { name: artio-secrets }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests: { cpu: 500m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: artio-api
spec:
  selector: { app: artio-api }
  ports: [{ name: http, port: 8080, targetPort: http }]
