services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - artio-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  opensearch:
    image: opensearchproject/opensearch:2.17.1
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: artio
      POSTGRES_USER: artio
      POSTGRES_PASSWORD: artio
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artio -d artio"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - artio-postgres-data:/var/lib/postgresql/data

  rest-api:
    build:
      context: ..
      dockerfile: artio-docker/Dockerfile
    environment:
      ARTIO_DATABASE_URL: jdbc:postgresql://postgres:5432/artio
      ARTIO_DATABASE_USERNAME: artio
      ARTIO_DATABASE_PASSWORD: artio
      ARTIO_SEARCH_ENABLED: "true"
      ARTIO_SEARCH_URL: http://opensearch:9200
      ARTIO_JWT_SECRET: ${ARTIO_JWT_SECRET:-replace-this-local-secret-with-at-least-32-random-bytes}
      ARTIO_BOOTSTRAP_ADMIN_EMAIL: ${ARTIO_BOOTSTRAP_ADMIN_EMAIL:-}
      ARTIO_BOOTSTRAP_ADMIN_PASSWORD: ${ARTIO_BOOTSTRAP_ADMIN_PASSWORD:-}
      ARTIO_STRIPE_SECRET_KEY: ${ARTIO_STRIPE_SECRET_KEY:-}
      ARTIO_STRIPE_WEBHOOK_SECRET: ${ARTIO_STRIPE_WEBHOOK_SECRET:-}
      ARTIO_STOREFRONT_URL: http://localhost:4200
      ARTIO_SMTP_HOST: ${ARTIO_SMTP_HOST:-localhost}
      ARTIO_SMTP_PORT: ${ARTIO_SMTP_PORT:-1025}
      ARTIO_SMTP_USERNAME: ${ARTIO_SMTP_USERNAME:-}
      ARTIO_SMTP_PASSWORD: ${ARTIO_SMTP_PASSWORD:-}
      ARTIO_SMTP_AUTH: ${ARTIO_SMTP_AUTH:-false}
      ARTIO_SMTP_STARTTLS: ${ARTIO_SMTP_STARTTLS:-false}
      ARTIO_MAIL_FROM: ${ARTIO_MAIL_FROM:-no-reply@artio.local}
      REDIS_HOST: redis
      KAFKA_BROKERS: kafka:9092
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  storefront:
    build:
      context: ..
      dockerfile: artio-docker/Dockerfile.frontend
      args:
        MODULE: artio-storefront
        APP_NAME: storefront
    ports:
      - "4200:80"
    depends_on:
      rest-api:
        condition: service_started

  backoffice:
    build:
      context: ..
      dockerfile: artio-docker/Dockerfile.frontend
      args:
        MODULE: artio-backoffice
        APP_NAME: backoffice
    ports:
      - "4201:80"
    depends_on:
      rest-api:
        condition: service_started

volumes:
  artio-postgres-data:
  artio-redis-data:
