services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - artio-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  opensearch:
    image: opensearchproject/opensearch:2.17.1
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20

  jaeger:
    image: jaegertracing/all-in-one:1.60
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

  prometheus:
    image: prom/prometheus:v2.54.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes:
      - ../artio-observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../artio-observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - artio-prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - rest-api

  grafana:
    image: grafana/grafana:11.2.2
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-this-local-password}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ../artio-observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../artio-observability/grafana/provisioning/dashboards/artio-overview.json:/var/lib/grafana/dashboards/artio-overview.json:ro
      - artio-grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: artio
      POSTGRES_USER: artio
      POSTGRES_PASSWORD: artio
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artio -d artio"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - artio-postgres-data:/var/lib/postgresql/data

  rest-api:
    build:
      context: ..
      dockerfile: artio-docker/Dockerfile
    environment:
      ARTIO_DATABASE_URL: jdbc:postgresql://postgres:5432/artio
      ARTIO_DATABASE_USERNAME: artio
      ARTIO_DATABASE_PASSWORD: artio
      ARTIO_SEARCH_ENABLED: "true"
      ARTIO_SEARCH_URL: http://opensearch:9200
      ARTIO_JWT_SECRET: ${ARTIO_JWT_SECRET:-replace-this-local-secret-with-at-least-32-random-bytes}
      ARTIO_ENCRYPTION_KEY: ${ARTIO_ENCRYPTION_KEY:-replace-this-local-encryption-secret-before-deployment}
      ARTIO_ALLOWED_ORIGINS: ${ARTIO_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:4201}
      ARTIO_BOOTSTRAP_ADMIN_EMAIL: ${ARTIO_BOOTSTRAP_ADMIN_EMAIL:-}
      ARTIO_BOOTSTRAP_ADMIN_PASSWORD: ${ARTIO_BOOTSTRAP_ADMIN_PASSWORD:-}
      ARTIO_STRIPE_SECRET_KEY: ${ARTIO_STRIPE_SECRET_KEY:-}
      ARTIO_STRIPE_WEBHOOK_SECRET: ${ARTIO_STRIPE_WEBHOOK_SECRET:-}
      ARTIO_STOREFRONT_URL: http://localhost:4200
      ARTIO_OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
      ARTIO_SMTP_HOST: ${ARTIO_SMTP_HOST:-localhost}
      ARTIO_SMTP_PORT: ${ARTIO_SMTP_PORT:-1025}
      ARTIO_SMTP_USERNAME: ${ARTIO_SMTP_USERNAME:-}
      ARTIO_SMTP_PASSWORD: ${ARTIO_SMTP_PASSWORD:-}
      ARTIO_SMTP_AUTH: ${ARTIO_SMTP_AUTH:-false}
      ARTIO_SMTP_STARTTLS: ${ARTIO_SMTP_STARTTLS:-false}
      ARTIO_MAIL_FROM: ${ARTIO_MAIL_FROM:-no-reply@artio.local}
      REDIS_HOST: redis
      KAFKA_BROKERS: kafka:9092
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      jaeger:
        condition: service_started

  storefront:
    build:
      context: ..
      dockerfile: artio-docker/Dockerfile.frontend
      args:
        MODULE: artio-storefront
        APP_NAME: storefront
    ports:
      - "4200:80"
    depends_on:
      rest-api:
        condition: service_started

  backoffice:
    build:
      context: ..
      dockerfile: artio-docker/Dockerfile.frontend
      args:
        MODULE: artio-backoffice
        APP_NAME: backoffice
    ports:
      - "4201:80"
    depends_on:
      rest-api:
        condition: service_started

volumes:
  artio-postgres-data:
  artio-redis-data:
  artio-prometheus-data:
  artio-grafana-data:
