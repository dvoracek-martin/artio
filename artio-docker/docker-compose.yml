services:
  redis:
    profiles: [cache]
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - artio-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - artio-kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  kafka-init:
    image: apache/kafka:4.3.1
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - >-
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092
        --create --if-not-exists --topic artio.order.events
        --partitions 3 --replication-factor 1
        --config retention.ms=604800000
        && /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092
        --create --if-not-exists --topic artio.order.events.dlq
        --partitions 3 --replication-factor 1
        --config retention.ms=2592000000
    depends_on:
      kafka:
        condition: service_healthy

  opensearch:
    profiles: [search]
    image: opensearchproject/opensearch:2.17.1
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${ARTIO_OPENSEARCH_INITIAL_ADMIN_PASSWORD:-}
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: artio
      POSTGRES_USER: ${ARTIO_DATABASE_USERNAME:-artio}
      POSTGRES_PASSWORD_FILE: /run/artio-secrets/database-password
    ports:
      - "127.0.0.1:${ARTIO_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artio -d artio"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - artio-postgres-data:/var/lib/postgresql/data
      - artio-installation-secrets:/run/artio-secrets:ro
    depends_on:
      installation-secrets:
        condition: service_completed_successfully

  installation-secrets:
    image: alpine:3.20
    entrypoint: ["/bin/sh", "/init/initialize-secrets.sh"]
    environment:
      ARTIO_DATABASE_PASSWORD: ${ARTIO_DATABASE_PASSWORD:-}
      ARTIO_JWT_SECRET: ${ARTIO_JWT_SECRET:-}
      ARTIO_ENCRYPTION_KEY: ${ARTIO_ENCRYPTION_KEY:-}
      ARTIO_SETUP_TOKEN: ${ARTIO_SETUP_TOKEN:-}
    volumes:
      - artio-installation-secrets:/run/artio-secrets
      - ./initialize-secrets.sh:/init/initialize-secrets.sh:ro

  rest-api:
    build:
      context: ..
      dockerfile: artio-docker/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-production}
      ARTIO_DATABASE_URL: jdbc:postgresql://postgres:5432/artio
      ARTIO_DATABASE_USERNAME: ${ARTIO_DATABASE_USERNAME:-artio}
      ARTIO_SEARCH_ENABLED: ${ARTIO_SEARCH_ENABLED:-false}
      ARTIO_SEARCH_URL: http://opensearch:9200
      ARTIO_EXTENSION_TRUSTED_REGISTRIES: ${ARTIO_EXTENSION_TRUSTED_REGISTRIES:-}
      ARTIO_EXTENSION_DOCKER_ENABLED: ${ARTIO_EXTENSION_DOCKER_ENABLED:-false}
      ARTIO_EXTENSION_DOCKER_NETWORK: artio-extensions
      ARTIO_INVENTORY_RESERVATION_TTL: ${ARTIO_INVENTORY_RESERVATION_TTL:-PT30M}
      ARTIO_INVENTORY_EXPIRY_INTERVAL_MS: ${ARTIO_INVENTORY_EXPIRY_INTERVAL_MS:-60000}
      ARTIO_ALLOWED_ORIGINS: ${ARTIO_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:4201}
      ARTIO_STRIPE_SECRET_KEY: ${ARTIO_STRIPE_SECRET_KEY:-}
      ARTIO_STRIPE_WEBHOOK_SECRET: ${ARTIO_STRIPE_WEBHOOK_SECRET:-}
      ARTIO_STOREFRONT_URL: http://localhost:4200
      MANAGEMENT_TRACING_ENABLED: ${ARTIO_TRACING_ENABLED:-false}
      ARTIO_OTLP_TRACING_ENDPOINT: ${ARTIO_OTLP_TRACING_ENDPOINT:-http://otel-collector:4318/v1/traces}
      ARTIO_METRICS_OTLP_ENABLED: ${ARTIO_METRICS_OTLP_ENABLED:-false}
      ARTIO_OTLP_METRICS_ENDPOINT: ${ARTIO_OTLP_METRICS_ENDPOINT:-http://otel-collector:4318/v1/metrics}
      ARTIO_SMTP_HOST: ${ARTIO_SMTP_HOST:-localhost}
      ARTIO_SMTP_PORT: ${ARTIO_SMTP_PORT:-1025}
      ARTIO_SMTP_USERNAME: ${ARTIO_SMTP_USERNAME:-}
      ARTIO_SMTP_PASSWORD: ${ARTIO_SMTP_PASSWORD:-}
      ARTIO_SMTP_AUTH: ${ARTIO_SMTP_AUTH:-false}
      ARTIO_SMTP_STARTTLS: ${ARTIO_SMTP_STARTTLS:-false}
      ARTIO_MAIL_FROM: ${ARTIO_MAIL_FROM:-no-reply@artio.local}
      ARTIO_EMAIL_ENABLED: ${ARTIO_EMAIL_ENABLED:-false}
      ARTIO_EMAIL_POLL_INTERVAL_MS: ${ARTIO_EMAIL_POLL_INTERVAL_MS:-30000}
      ARTIO_WORKERS_ENABLED: "false"
      ARTIO_KAFKA_CONSUMER_ENABLED: "false"
      REDIS_HOST: redis
      ARTIO_CACHE_REDIS_ENABLED: ${ARTIO_CACHE_REDIS_ENABLED:-false}
      KAFKA_BROKERS: kafka:9092
    ports:
      - "${ARTIO_BIND_ADDRESS:-127.0.0.1}:${ARTIO_API_PORT:-8080}:8080"
    networks:
      - default
      - extensions
    volumes:
      - artio-installation-secrets:/run/artio-secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      installation-secrets:
        condition: service_completed_successfully

  event-worker:
    build:
      context: ..
      dockerfile: artio-docker/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-production}
      ARTIO_DATABASE_URL: jdbc:postgresql://postgres:5432/artio
      ARTIO_DATABASE_USERNAME: ${ARTIO_DATABASE_USERNAME:-artio}
      ARTIO_WORKERS_ENABLED: "true"
      ARTIO_KAFKA_EVENTS_ENABLED: "true"
      ARTIO_KAFKA_CONSUMER_ENABLED: "true"
      ARTIO_KAFKA_CONSUMER_GROUP: artio-notification-worker
      ARTIO_KAFKA_ORDER_TOPIC: artio.order.events
      ARTIO_KAFKA_CONSUMER_CONCURRENCY: ${ARTIO_KAFKA_CONSUMER_CONCURRENCY:-1}
      ARTIO_EVENTS_OUTBOX_POLL_INTERVAL_MS: ${ARTIO_EVENTS_OUTBOX_POLL_INTERVAL_MS:-1000}
      ARTIO_INVENTORY_RESERVATION_TTL: ${ARTIO_INVENTORY_RESERVATION_TTL:-PT30M}
      ARTIO_INVENTORY_EXPIRY_INTERVAL_MS: ${ARTIO_INVENTORY_EXPIRY_INTERVAL_MS:-60000}
      ARTIO_EMAIL_ENABLED: ${ARTIO_EMAIL_ENABLED:-false}
      ARTIO_EMAIL_POLL_INTERVAL_MS: ${ARTIO_EMAIL_POLL_INTERVAL_MS:-30000}
      ARTIO_SMTP_HOST: ${ARTIO_SMTP_HOST:-localhost}
      ARTIO_SMTP_PORT: ${ARTIO_SMTP_PORT:-1025}
      ARTIO_SMTP_USERNAME: ${ARTIO_SMTP_USERNAME:-}
      ARTIO_SMTP_PASSWORD: ${ARTIO_SMTP_PASSWORD:-}
      ARTIO_SMTP_AUTH: ${ARTIO_SMTP_AUTH:-false}
      ARTIO_SMTP_STARTTLS: ${ARTIO_SMTP_STARTTLS:-false}
      ARTIO_MAIL_FROM: ${ARTIO_MAIL_FROM:-no-reply@artio.local}
      ARTIO_STRIPE_SECRET_KEY: ${ARTIO_STRIPE_SECRET_KEY:-}
      ARTIO_STRIPE_WEBHOOK_SECRET: ${ARTIO_STRIPE_WEBHOOK_SECRET:-}
      KAFKA_BROKERS: kafka:9092
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
    volumes:
      - artio-installation-secrets:/run/artio-secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      installation-secrets:
        condition: service_completed_successfully

  storefront:
    profiles: [storefront]
    build:
      context: ..
      dockerfile: artio-docker/Dockerfile.frontend
      args:
        MODULE: artio-storefront
        APP_NAME: storefront
    ports:
      - "${ARTIO_BIND_ADDRESS:-127.0.0.1}:${ARTIO_STOREFRONT_PORT:-4200}:80"
    depends_on:
      rest-api:
        condition: service_started

  backoffice:
    build:
      context: ..
      dockerfile: artio-docker/Dockerfile.frontend
      args:
        MODULE: artio-backoffice
        APP_NAME: backoffice
    ports:
      - "${ARTIO_BIND_ADDRESS:-127.0.0.1}:${ARTIO_BACKOFFICE_PORT:-4201}:80"
    depends_on:
      rest-api:
        condition: service_started

volumes:
  artio-postgres-data:
  artio-redis-data:
  artio-installation-secrets:
  artio-kafka-data:

networks:
  default: {}
  extensions:
    name: artio-extensions
    internal: true
