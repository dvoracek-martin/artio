services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0@sha256:39923a8e431bd1f57be82411999d389fcfe40857492e4365456d97a4c1f74be6
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    expose:
      - "4317"
      - "4318"
      - "9464"
    depends_on:
      - jaeger

  jaeger:
    image: quay.io/jaegertracing/jaeger:2.22.0@sha256:836b967b5abcf1f7758066aa6b348619267a2f1459f72d472840570f9bd88a17
    ports:
      - "127.0.0.1:16686:16686"

  prometheus:
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - artio-prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    environment:
      GF_SECURITY_ADMIN_USER: ${ARTIO_OBSERVABILITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: "${ARTIO_OBSERVABILITY_ADMIN_PASSWORD:?Set ARTIO_OBSERVABILITY_ADMIN_PASSWORD}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/provisioning/dashboards/artio-overview.json:/var/lib/grafana/dashboards/artio-overview.json:ro
      - artio-grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

  rest-api:
    environment:
      MANAGEMENT_TRACING_ENABLED: ${ARTIO_OBSERVABILITY_TRACES_ENABLED:-true}
      ARTIO_METRICS_OTLP_ENABLED: ${ARTIO_OBSERVABILITY_METRICS_ENABLED:-true}
      ARTIO_OTLP_TRACING_ENDPOINT: http://extension-controller:8090/internal/v1/telemetry/observability.artio/traces
      ARTIO_OTLP_METRICS_ENDPOINT: http://extension-controller:8090/internal/v1/telemetry/observability.artio/metrics
    depends_on:
      otel-collector:
        condition: service_started

volumes:
  artio-prometheus-data:
  artio-grafana-data:
